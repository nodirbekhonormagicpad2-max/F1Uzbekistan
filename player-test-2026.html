<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>F1 Uzbekistan TV — Yangi pleer sinovi</title>
  <link
    rel="stylesheet"
    href="https://vjs.zencdn.net/8.23.4/video-js.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #090909;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 12px;
    }

    h1 {
      margin: 18px 0 25px;
      text-align: center;
      color: #e10600;
      font-size: clamp(22px, 5vw, 36px);
    }

    .player-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 2px solid #e10600;
      border-radius: 12px;
      background: #000;
    }

    .video-js {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
    }

    .video-js .vjs-big-play-button {
      background: #e10600;
      border: 0;
      border-radius: 10px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .buttons button {
      flex: 1 1 140px;
      min-height: 52px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #e10600;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .buttons button.secondary {
      background: #333;
    }

    .buttons button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .status {
      margin-top: 18px;
      padding: 16px;
      border-radius: 10px;
      background: #1c1c1c;
      color: #ddd;
      font-size: 14px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .status.success {
      color: #58e895;
    }

    .status.error {
      color: #ff7373;
    }

    .hint {
      margin-top: 15px;
      color: #999;
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 600px) {
      .container {
        padding: 14px 10px;
      }

      .buttons button {
        font-size: 13px;
        padding: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🏎️ F1 UZBEKISTAN TV</h1>

    <div class="player-box">
      <video
        id="f1-player"
        class="video-js vjs-default-skin"
        controls
        playsinline
        preload="none">
      </video>
    </div>

    <div class="buttons">

      <button id="playBtn" type="button">
        ▶ Efirni boshlash
      </button>

      <button id="refreshBtn" type="button">
        ↻ Yangilash
      </button>

      <button
        id="fullscreenBtn"
        class="secondary"
        type="button">
        ⛶ Katta ekran
      </button>

    </div>

    <div class="status" id="status">
      ⏳ VK Live efiri tekshirilmoqda...
    </div>

    <div class="hint">
      Manba: OBS → VK Live → Cloudflare Worker → Video.js
    </div>

  </div>

  <script src="https://vjs.zencdn.net/8.23.4/video.min.js"></script>

  <script>
    "use strict";

    // Sizning Cloudflare Worker manzilingiz
    const WORKER_URL =
      "https://f1-uzbekistan-live.nodirbekhonormagicpad2.workers.dev";

    const statusBox =
      document.getElementById("status");

    const playBtn =
      document.getElementById("playBtn");

    const refreshBtn =
      document.getElementById("refreshBtn");

    const fullscreenBtn =
      document.getElementById("fullscreenBtn");

    let currentHls = "";
    let loading = false;

    // Video.js pleer
    const player = videojs("f1-player", {
      controls: true,
      autoplay: false,
      preload: "none",
      fluid: false,
      responsive: true,
      liveui: true,
      html5: {
        vhs: {
          overrideNative: true
        }
      }
    });

    function setStatus(message, type = "") {
      statusBox.textContent = message;
      statusBox.className = "status " + type;
    }

    // VK Live'dan HLS manzilini olish
    async function loadStream(startPlayback = false) {
      if (loading) return;

      loading = true;
      refreshBtn.disabled = true;

      setStatus("🔄 VK Live efiri tekshirilmoqda...");

      try {
        const endpoint =
          WORKER_URL +
          "/stream?t=" +
          Date.now();

        const response = await fetch(endpoint, {
          cache: "no-store"
        });

        const data = await response.json();

        if (!response.ok || !data.ok) {
          throw new Error(
            data.error || "VK Live efiri topilmadi"
          );
        }

        if (!data.hls) {
          throw new Error("HLS manzili mavjud emas");
        }

        const hlsUrl = new URL(data.hls);

        if (hlsUrl.protocol !== "https:") {
          throw new Error("HLS manzili HTTPS emas");
        }

        currentHls = hlsUrl.href;

        player.src({
          src: currentHls,
          type: "application/x-mpegURL"
        });

        setStatus(
          "✅ HLS manzili topildi. " +
          "▶ Efirni boshlash tugmasini bosing.",
          "success"
        );

        if (startPlayback) {
          try {
            await player.play();
          } catch (playError) {
            setStatus(
              "⚠️ HLS topildi, ammo video boshlanmadi: " +
              playError.message,
              "error"
            );
          }
        }

      } catch (error) {
        console.error("HLS xatosi:", error);

        setStatus(
          "❌ Xatolik: " + error.message,
          "error"
        );

      } finally {
        loading = false;
        refreshBtn.disabled = false;
      }
    }

    // Efirni boshlash
    playBtn.addEventListener("click", async function () {
      if (!currentHls) {
        await loadStream(true);
        return;
      }

      try {
        await player.play();
      } catch (error) {
        setStatus(
          "❌ Video boshlanmadi: " + error.message,
          "error"
        );
      }
    });

    // Yangilash
    refreshBtn.addEventListener("click", function () {
      loadStream(false);
    });

    // Katta ekran
    fullscreenBtn.addEventListener("click", function () {
      player.requestFullscreen();
    });

    // Video ishlay boshlaganda
    player.on("playing", function () {
      setStatus(
        "🔴 F1 Uzbekistan TV — jonli efir ishlayapti!",
        "success"
      );
    });

    // Video xatosi
    player.on("error", function () {
      const error = player.error();

      setStatus(
        "❌ Video ochilmadi: " +
        (error ? error.message : "Noma'lum xatolik") +
        ". VK HLS oqimida CORS, IP yoki boshqa cheklov bo'lishi mumkin.",
        "error"
      );
    });

    // Sahifa ochilganda HLS manzilini qidirish
    loadStream(false);

  </script>

</body>
</html>
