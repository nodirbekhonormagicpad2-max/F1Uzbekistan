
<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>F1 Uzbekistan TV | Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080a0e;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 24px 16px;
    }

    .box {
      max-width: 600px;
      margin: 30px auto;
      background: #141820;
      border: 1px solid #303540;
      border-radius: 20px;
      padding: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    h2 {
      font-size: 23px;
      margin: 0;
    }

    .red {
      color: #ff303e;
    }

    p {
      color: #aeb5c1;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 19px 0 8px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 15px;
      background: #090c11;
      border: 1px solid #414753;
      border-radius: 10px;
      color: #fff;
      font: inherit;
      font-size: 16px;
    }

    textarea {
      min-height: 250px;
      resize: vertical;
      line-height: 1.65;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #ff303e;
    }

    input[type="file"] {
      padding: 12px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 16px;
      background: #e7192b;
      border: 0;
      border-radius: 11px;
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: wait;
    }

    .status {
      margin-top: 18px;
      white-space: pre-wrap;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .success {
      color: #56e7a0;
    }

    .error {
      color: #ff737d;
    }

    .hidden {
      display: none !important;
    }

    .preview {
      margin-top: 14px;
      width: 100%;
      max-height: 280px;
      object-fit: contain;
      background: #000;
      border-radius: 10px;
    }

    a {
      color: #ff737d;
    }

    .count {
      font-size: 12px;
      color: #aeb5c1;
      text-align: right;
      margin-top: 6px;
    }
  </style>
</head>

<body>
  <div class="box">

    <h1>
      🏎️ <span class="red">F1 UZBEKISTAN TV</span> ADMIN
    </h1>

    <p>F1 STORIES postlarini boshqarish.</p>

    <label for="password">
      🔐 Admin paroli
    </label>

    <input
      id="password"
      type="password"
      autocomplete="current-password"
      required
    >

    <section aria-label="F1 Stories post yuklash">

      <h2>
        📸 <span class="red">F1 STORIES</span>
        — POST QO‘SHISH
      </h2>

      <p>
        Rasm va sarlavha kiriting.
        To‘liq maqola ixtiyoriy.
      </p>

      <form id="f1-photo-form">

        <label for="f1-photo-file">
          🖼️ Rasm (JPG, PNG, WebP — 10 MB gacha)
        </label>

        <input
          id="f1-photo-file"
          type="file"
          accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp"
          required
        >

        <img
          id="f1-photo-preview"
          class="preview hidden"
          alt="Tanlangan surat"
        >

        <label for="f1-photo-title">
          📰 Sarlavha
        </label>

        <input
          id="f1-photo-title"
          type="text"
          maxlength="160"
          required
          placeholder="F1 yangiliklari"
        >

        <label for="f1-photo-article">
          📝 To‘liq maqola (ixtiyoriy)
        </label>

        <textarea
          id="f1-photo-article"
          maxlength="30000"
          placeholder="Bo‘sh qoldirish mumkin"
        ></textarea>

        <div id="articleCount" class="count">
          0 / 30000 belgi
        </div>

        <label for="f1-photo-source">
          🔗 Manba (ixtiyoriy)
        </label>

        <input
          id="f1-photo-source"
          type="text"
          maxlength="300"
          placeholder="Masalan: Formula 1"
        >

        <button type="submit" id="f1-photo-submit">
          📸 POSTNI CHOP ETISH
        </button>

        <p
          id="f1-photo-status"
          class="status"
          role="status"
          aria-live="polite"
        ></p>

      </form>
    </section>

    <p>
      <a href="/">← Bosh sahifaga qaytish</a>
    </p>

  </div>

  <script>
    "use strict";

    const $ = id => document.getElementById(id);

    async function parseResponse(response) {
      const type =
        response.headers.get("content-type") || "";

      if (!type.includes("application/json")) {
        throw Error(
          "Server JSON javob qaytarmadi. HTTP: " +
          response.status
        );
      }

      const data = await response.json();

      if (!response.ok || !data.success) {
        throw Error(
          data.error ||
          "Server xatosi: " + response.status
        );
      }

      return data;
    }

    (() => {
      const form = $("f1-photo-form");
      const submit = $("f1-photo-submit");
      const status = $("f1-photo-status");
      const fileInput = $("f1-photo-file");
      const preview = $("f1-photo-preview");
      const article = $("f1-photo-article");

      let imageURL = null;

      function show(text, type = "") {
        status.textContent = text;
        status.className = "status " + type;
      }

      article.addEventListener("input", () => {
        $("articleCount").textContent =
          article.value.length +
          " / 30000 belgi";
      });

      fileInput.addEventListener("change", () => {
        if (imageURL) {
          URL.revokeObjectURL(imageURL);
        }

        imageURL = null;
        preview.classList.add("hidden");

        const file = fileInput.files[0];

        if (
          file &&
          [
            "image/jpeg",
            "image/png",
            "image/webp"
          ].includes(file.type)
        ) {
          imageURL = URL.createObjectURL(file);
          preview.src = imageURL;
          preview.classList.remove("hidden");
        }
      });

      form.addEventListener("submit", async event => {
        event.preventDefault();

        const password = $("password").value;
        const file = fileInput.files[0];
        const title =
          $("f1-photo-title").value.trim();
        const text = article.value.trim();
        const source =
          $("f1-photo-source").value.trim();

        if (!password.trim()) {
          show(
            "❌ Admin parolini kiriting.",
            "error"
          );
          $("password").focus();
          return;
        }

        if (
          !file ||
          ![
            "image/jpeg",
            "image/png",
            "image/webp"
          ].includes(file.type) ||
          file.size < 12 ||
          file.size > 10 * 1024 * 1024
        ) {
          show(
            "❌ JPG, PNG yoki WebP rasm tanlang (10 MB gacha).",
            "error"
          );
          return;
        }

        if (
          !title ||
          title.length > 160 ||
          text.length > 30000 ||
          source.length > 300
        ) {
          show(
            "❌ Matn uzunligini tekshiring.",
            "error"
          );
          return;
        }

        const data = new FormData();

        data.append("password", password);
        data.append("title_uz", title);
        data.append("article_uz", text);
        data.append("source", source);
        data.append("image", file);

        submit.disabled = true;

        show(
          "⏳ F1 STORIES posti yuklanmoqda..."
        );

        try {
          const result = await parseResponse(
            await fetch("/api/photos", {
              method: "POST",
              body: data,
              cache: "no-store"
            })
          );

          if (!result.photo?.id) {
            throw Error(
              "Post javobi to‘liq emas. " +
              "Qayta yuborishdan oldin saytni tekshiring."
            );
          }

          show(
            "✅ F1 STORIES posti muvaffaqiyatli saqlandi!",
            "success"
          );

          form.reset();

          $("articleCount").textContent =
            "0 / 30000 belgi";

          if (imageURL) {
            URL.revokeObjectURL(imageURL);
          }

          imageURL = null;
          preview.classList.add("hidden");

        } catch (error) {
          show(
            "❌ " + error.message,
            "error"
          );

        } finally {
          submit.disabled = false;
        }
      });
    })();
  </script>

  <script
    src="./admin-story-editor.js?v=20261028-2"
    defer
  ></script>

</body>
</html>
