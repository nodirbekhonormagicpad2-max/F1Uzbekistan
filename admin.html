<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>F1 CINEMA | Admin</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #080a0e; color: #fff; font-family: Arial, sans-serif; padding: 24px 16px; }
    .box { max-width: 540px; margin: 30px auto; background: #141820; border: 1px solid #303540; border-radius: 20px; padding: 24px; }
    h1 { margin: 0 0 8px; font-size: 26px; }
    .red { color: #ff303e; }
    p { color: #aeb5c1; line-height: 1.5; }
    label { display: block; margin: 20px 0 8px; font-weight: bold; }
    input, select { width: 100%; padding: 15px; background: #090c11; border: 1px solid #414753; border-radius: 10px; color: white; font-size: 16px; }
    input:focus, select:focus { outline: none; border-color: #ff303e; }
    input[type="file"] { padding: 12px; }
    button { width: 100%; margin-top: 22px; padding: 16px; background: #e7192b; border: 0; border-radius: 11px; color: white; font-size: 17px; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    #message { margin-top: 20px; white-space: pre-wrap; line-height: 1.5; }
    .success { color: #56e7a0; }
    .error { color: #ff737d; }
    .hint { font-size: 13px; color: #aeb5c1; }
    .hidden { display: none; }
    a { color: #ff737d; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🏎️ <span class="red">F1 CINEMA</span> ADMIN</h1>
    <p>Facebook Reels qo‘shing yoki o‘zingizning videongizni yuklang.</p>

    <form id="videoForm">
      <label for="password">🔐 Admin paroli</label>
      <input id="password" type="password" autocomplete="current-password" required placeholder="Admin parolingiz">

      <label for="platform">🎬 Video turi</label>
      <select id="platform">
        <option value="facebook">🔵 Facebook Reels (9:16)</option>
        <option value="upload">🟢 O‘z videomni yuklash</option>
      </select>

      <div id="facebookFields">
        <label for="url">🔗 Facebook Reels havolasi</label>
        <input id="url" type="url" placeholder="https://www.facebook.com/reel/..." required>
        <p class="hint">Ommaviy Facebook Reels havolasini kiriting. Ayrim Reels videolari tashqi saytlarda ochilmasligi mumkin.</p>
      </div>

      <div id="uploadFields" class="hidden">
        <label for="videoFile">📱 Telefondan video tanlang</label>
        <input id="videoFile" type="file" accept="video/mp4,video/webm,video/quicktime,video/*">
        <p class="hint">Video yuklash Cloudflare R2 va server sozlamalari tayyor bo‘lgach ishlaydi.</p>
      </div>

      <label for="title">📝 Video nomi</label>
      <input id="title" type="text" maxlength="160" required placeholder="Formula 1 — qiziqarli lavha">

      <label for="thumbnail">🖼️ Muqova rasmi URL (ixtiyoriy)</label>
      <input id="thumbnail" type="text" placeholder="https://... yoki ./rasm.jpg">

      <button id="submitBtn" type="submit">➕ VIDEO QO‘SHISH</button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>
    <p><a href="/">← Bosh sahifaga qaytish</a></p>
  </div>

  <script>
    const form = document.getElementById('videoForm');
    const button = document.getElementById('submitBtn');
    const message = document.getElementById('message');
    const platform = document.getElementById('platform');
    const facebookFields = document.getElementById('facebookFields');
    const uploadFields = document.getElementById('uploadFields');
    const urlInput = document.getElementById('url');
    const videoFile = document.getElementById('videoFile');

    function updateMode() {
      const isUpload = platform.value === 'upload';
      facebookFields.classList.toggle('hidden', isUpload);
      uploadFields.classList.toggle('hidden', !isUpload);
      urlInput.required = !isUpload;
      videoFile.required = isUpload;
      button.textContent = isUpload ? '⬆️ VIDEO YUKLASH' : '➕ VIDEO QO‘SHISH';
      message.textContent = '';
      message.className = '';
    }
    platform.addEventListener('change', updateMode);
    updateMode();

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = '';
      message.className = '';

      if (platform.value === 'upload') {
        message.className = 'error';
        message.textContent = '⚙️ Video yuklash hali ulanmagan. Avval Cloudflare R2 va serverdagi upload funksiyasini sozlashimiz kerak. Video hozircha yuklanmadi.';
        return;
      }

      const url = urlInput.value.trim();
      let parsed;
      try { parsed = new URL(url); } catch (_) {
        message.className = 'error';
        message.textContent = '❌ Facebook havolasi noto‘g‘ri.';
        return;
      }
      if (!['facebook.com', 'www.facebook.com', 'm.facebook.com', 'fb.watch'].includes(parsed.hostname.toLowerCase()) || parsed.protocol !== 'https:') {
        message.className = 'error';
        message.textContent = '❌ Facebook Reels havolasini kiriting.';
        return;
      }

      button.disabled = true;
      button.textContent = '⏳ Saqlanmoqda...';
      try {
        const response = await fetch('/api/videos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Cache-Control': 'no-store' },
          body: JSON.stringify({
            platform: 'facebook',
            password: document.getElementById('password').value,
            url,
            title_uz: document.getElementById('title').value.trim(),
            thumbnail: document.getElementById('thumbnail').value.trim()
          })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Xatolik yuz berdi');
        message.className = 'success';
        message.textContent = '✅ Facebook Reels saqlandi! Cloudflare yangilangach F1 CINEMA’da ko‘rinadi.';
        urlInput.value = '';
        document.getElementById('title').value = '';
        document.getElementById('thumbnail').value = '';
      } catch (error) {
        message.className = 'error';
        message.textContent = '❌ ' + error.message + '\nFacebook Reels uchun server kodi ham yangilanishi kerak.';
      } finally {
        button.disabled = false;
        updateMode();
      }
    });
  </script>
</body>
</html>
