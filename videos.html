<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F1 CINEMA | F1 Uzbekistan TV</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#f7f8fa;color:#16181e;font:15px system-ui,Arial,sans-serif}
header{background:#fff;border-bottom:3px solid #e10600;padding:18px max(18px,calc((100% - 1180px)/2));display:flex;justify-content:space-between;align-items:center;gap:10px}
header a{color:#17191f;text-decoration:none;font-weight:800}
.site-logo{font-size:clamp(12px,2vw,16px)}
.home-button{background:#e10600;color:white;padding:10px 13px;border-radius:9px;font-size:12px;white-space:nowrap}
main{max-width:1180px;margin:auto;padding:28px 18px}
h1{font-size:clamp(27px,5vw,42px);margin:0 0 8px}
h1 span{color:#e10600}
.sub{color:#626875;margin-bottom:24px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{background:white;border:1px solid #e0e2e7;border-radius:14px;overflow:hidden;box-shadow:0 3px 14px #10131a0b}
.thumb{position:relative;display:grid;place-items:center;width:100%;aspect-ratio:16/9;padding:0;border:0;background:#eceef2;overflow:hidden;cursor:pointer;color:#818793}
.thumb.portrait{aspect-ratio:9/16}
.thumb.square{aspect-ratio:1}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.placeholder{font-size:46px;opacity:.65}
.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#e10600;border-radius:12px;padding:11px 17px;font-size:23px;color:#fff;box-shadow:0 3px 18px #0005}
.info{padding:15px}
.info h2{font-size:16px;line-height:1.45;margin:0 0 10px;overflow-wrap:anywhere}
.meta{font-size:12px;color:#777e88}
.status{color:#626875;padding:25px 0}
.status:empty{display:none}
.viewer{position:fixed;inset:0;background:rgba(250,250,252,.98);display:none;place-items:center;padding:12px;z-index:9999;overflow:auto}
.viewer.open{display:grid}
.modal{width:min(900px,100%);margin:auto}
.modal-header{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-bottom:10px}
.modal-title{font-weight:800;line-height:1.4;margin-right:auto}
.modal-title:empty{display:none}
.close{background:#e10600;border:0;color:white;padding:10px 15px;border-radius:7px;cursor:pointer;flex-shrink:0}
.frame{width:100%;aspect-ratio:16/9;background:#111;border-radius:10px;overflow:hidden}
.frame.portrait{width:min(420px,100%);aspect-ratio:9/16;max-height:78vh;margin:auto}
.frame.square{width:min(650px,100%);aspect-ratio:1;margin:auto}
.frame.telegram{width:min(680px,100%);aspect-ratio:auto;min-height:320px;padding:0;background:transparent;overflow:visible;text-align:center}
.telegram-widget-wrap{width:100%;min-height:300px;display:flex;justify-content:center;align-items:flex-start}
.frame video,.frame iframe{width:100%;height:100%;display:block;border:0}
.frame.telegram iframe{width:100%;max-width:100%;height:auto;min-height:300px}
.frame video{object-fit:contain}
@media(max-width:700px){main{padding:23px 15px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.info{padding:10px}.info h2{font-size:13px;line-height:1.4;margin:0 0 7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.meta{font-size:11px}.play{padding:8px 12px;font-size:17px;border-radius:9px}.home-button{font-size:11px;padding:9px 10px}}
@media(max-width:360px){.grid{gap:9px}.info{padding:8px}.info h2{font-size:12px}}

/* F1 CINEMA — refreshed gallery */
body{background:#f5f6f8}
main{padding-top:34px}
.grid{align-items:stretch;gap:18px}
.card{display:flex;flex-direction:column;border:1px solid #e2e4e9;border-radius:18px;box-shadow:0 8px 24px #1b20300b;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px #1b203018}
.thumb,.thumb.portrait,.thumb.square{aspect-ratio:4/3;background:#e7e9ee;isolation:isolate}
.thumb::before{content:"";position:absolute;inset:-12px;background-image:var(--poster);background-size:cover;background-position:center;filter:blur(16px) brightness(.75);opacity:.55;z-index:-1}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;z-index:0}
.thumb .placeholder{position:relative;z-index:0}
.thumb .play{z-index:1;border-radius:50%;width:55px;height:55px;display:grid;place-items:center;padding:0;font-size:21px;box-shadow:0 6px 22px #0005}
.info{padding:15px 16px 17px;flex:1;display:flex;flex-direction:column;gap:8px}
.info h2{margin:0;font-size:15px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{margin-top:auto}
@media(max-width:700px){.grid{gap:12px}.card{border-radius:14px}.thumb,.thumb.portrait,.thumb.square{aspect-ratio:3/4}.thumb .play{width:46px;height:46px;font-size:18px}.info{padding:12px;gap:7px}.info h2{font-size:13px;line-height:1.4}.meta{font-size:11px}}
</style>
</head>
<body>
<header><a href="./index.html" class="site-logo">🏎️ F1 UZBEKISTAN TV</a><a href="./index.html" class="home-button">← Bosh sahifaga</a></header>
<main><h1>🎬 F1 <span>CINEMA</span></h1><p class="sub">Formula 1 olamidagi videolar.</p><p id="status" class="status" role="status">Videolar yuklanmoqda…</p><section id="grid" class="grid" aria-label="Videolar ro‘yxati"></section></main>
<div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="Video pleer"><div class="modal"><div class="modal-header"><div id="modal-title" class="modal-title"></div><button id="close" class="close" type="button">✕ Yopish</button></div><div id="frame" class="frame"></div></div></div>
<script>
(()=>{
'use strict';
const grid=document.getElementById('grid'),status=document.getElementById('status'),viewer=document.getElementById('viewer'),frame=document.getElementById('frame'),closeButton=document.getElementById('close'),modalTitle=document.getElementById('modal-title');
let videos=[],previousOverflow='',lastFocus=null,loading=false;
const str=v=>typeof v==='string'?v:'';
const title=v=>str(v.title_uz)||str(v.title)||'F1 videosi';
const rawURL=v=>str(v.video_url)||str(v.videoUrl)||str(v.url);
function telegramPost(v){
 try{const u=new URL(rawURL(v));if(u.protocol!=='https:'||!['t.me','www.t.me','telegram.me','www.telegram.me'].includes(u.hostname))return '';
 const m=u.pathname.match(/^\/f1cinema\/(\d+)\/?$/i);return m?'f1cinema/'+m[1]:'';}catch{return '';}
}
function driveId(raw){try{const u=new URL(raw);if(u.protocol!=='https:'||u.hostname!=='drive.google.com')return '';const m=u.pathname.match(/^\/file\/d\/([A-Za-z0-9_-]+)(?:\/|$)/);if(m)return m[1];if(u.pathname==='/open'||u.pathname==='/uc'){const id=u.searchParams.get('id')||'';return /^[A-Za-z0-9_-]+$/.test(id)?id:'';}return '';}catch{return '';}}
function directURL(raw){try{const u=new URL(raw,location.href);if(!['https:','http:'].includes(u.protocol))return '';if(u.protocol==='http:'&&u.origin!==location.origin)return '';return /\.(mp4|webm)$/i.test(u.pathname)?u.href:'';}catch{return '';}}
function source(v){const post=telegramPost(v);if(post)return {kind:'telegram',post};const raw=rawURL(v),id=driveId(raw);if(id)return {kind:'drive',url:'https://drive.google.com/file/d/'+encodeURIComponent(id)+'/preview'};const direct=directURL(raw);return direct?{kind:'direct',url:direct}:null;}
function thumbnail(v){const raw=str(v.thumbnail)||str(v.thumbnail_url)||str(v.thumbnailUrl);if(!raw)return '';try{const u=new URL(raw,location.href);return u.protocol==='https:'||(u.protocol==='http:'&&u.origin===location.origin)?u.href:'';}catch{return '';}}
function format(v){const r=str(v.aspect_ratio)||str(v.aspectRatio);return r==='9:16'?'portrait':r==='1:1'?'square':'landscape';}
function closeVideo(){if(!viewer.classList.contains('open'))return;viewer.classList.remove('open');const player=frame.querySelector('video');if(player){player.pause();player.removeAttribute('src');player.load();}frame.replaceChildren();document.body.style.overflow=previousOverflow;if(lastFocus&&lastFocus.isConnected)lastFocus.focus();}
function openVideo(v){
 const s=source(v);if(!s)return;
 lastFocus=document.activeElement;previousOverflow=document.body.style.overflow;
 frame.replaceChildren();frame.className='frame '+(s.kind==='telegram'?'telegram':format(v));
 // Telegramning o'zida sarlavha bor: yuqorida takrorlamaymiz.
 modalTitle.textContent=s.kind==='telegram'?'':title(v);
 if(s.kind==='telegram'){
  const wrap=document.createElement('div');wrap.className='telegram-widget-wrap';
  const script=document.createElement('script');script.async=true;script.src='https://telegram.org/js/telegram-widget.js?22';
  script.dataset.telegramPost=s.post;script.dataset.width='100%';script.dataset.userpic='false';
  wrap.append(script);frame.append(wrap);
 }else if(s.kind==='drive'){
  const iframe=document.createElement('iframe');iframe.src=s.url;iframe.title=title(v);iframe.allow='autoplay; fullscreen; picture-in-picture';iframe.allowFullscreen=true;iframe.referrerPolicy='strict-origin-when-cross-origin';frame.append(iframe);
 }else{
  const player=document.createElement('video');player.controls=true;player.playsInline=true;player.autoplay=true;player.preload='metadata';player.src=s.url;
  player.addEventListener('loadedmetadata',()=>{if(!player.videoWidth||!player.videoHeight)return;const ratio=player.videoWidth/player.videoHeight;frame.className='frame '+(ratio<.85?'portrait':ratio>1.15?'landscape':'square');});
  frame.append(player);player.play().catch(()=>{});
 }
 viewer.classList.add('open');document.body.style.overflow='hidden';closeButton.focus();
}
function render(){
 grid.replaceChildren();status.textContent=videos.length?'':'Hozircha videolar mavjud emas.';
 for(const v of videos){
  const card=document.createElement('article');card.className='card';
  const thumb=document.createElement('button');thumb.type='button';thumb.className='thumb '+format(v);thumb.setAttribute('aria-label',title(v)+' — tomosha qilish');
  const poster=thumbnail(v);if(poster)thumb.style.setProperty('--poster','url('+JSON.stringify(poster)+')');const placeholder=document.createElement('span');placeholder.className='placeholder';placeholder.textContent='🎬';thumb.append(placeholder);
  if(poster){const img=document.createElement('img');img.loading='lazy';img.decoding='async';img.alt='';img.addEventListener('load',()=>placeholder.remove());img.addEventListener('error',()=>img.remove());img.src=poster;thumb.append(img);}
  const play=document.createElement('span');play.className='play';play.textContent='▶';thumb.append(play);thumb.addEventListener('click',()=>openVideo(v));
  const info=document.createElement('div');info.className='info';const h=document.createElement('h2');h.textContent=title(v);info.append(h);
  const dateValue=v.published||v.publishedAt||v.createdAt;let date=null;
  if(typeof dateValue==='number')date=new Date(dateValue<1e11?dateValue*1000:dateValue);else if(dateValue)date=new Date(dateValue);
  if(date&&!Number.isNaN(date.getTime())){const meta=document.createElement('div');meta.className='meta';meta.textContent=date.toLocaleDateString('uz-UZ');info.append(meta);}
  card.append(thumb,info);grid.append(card);
 }
}
async function readList(filename){const response=await fetch('./'+filename+'?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error(filename+': HTTP '+response.status);const data=await response.json();return Array.isArray(data)?data:Array.isArray(data?.videos)?data.videos:[];}
async function load(){
 if(loading)return;loading=true;
 try{
  const results=await Promise.allSettled([readList('telegram-videos.json'),readList('uploaded-videos.json')]);
  const items=[];let success=false;
  for(const result of results){if(result.status==='fulfilled'){items.push(...result.value);success=true;}else console.warn('F1 CINEMA:',result.reason);}
  if(!success)throw Error('Video ro‘yxatlari yuklanmadi');
  const seen=new Set();
  videos=items.filter(v=>{if(!v||typeof v!=='object'||!source(v))return false;const key=telegramPost(v)||str(v.id)||rawURL(v);if(seen.has(key))return false;seen.add(key);return true;});
  videos.sort((a,b)=>new Date(b.published||b.createdAt||0)-new Date(a.published||a.createdAt||0));
  render();
 }catch(e){console.error('F1 CINEMA:',e);status.textContent='Videolar ro‘yxatini yuklab bo‘lmadi.';}finally{loading=false;}
}
closeButton.addEventListener('click',closeVideo);
viewer.addEventListener('click',e=>{if(e.target===viewer)closeVideo();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeVideo();});
load();setInterval(load,300000);
})();
</script>
</body>
</html>
