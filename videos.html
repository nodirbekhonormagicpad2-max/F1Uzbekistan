<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>F1 Video Highlights | F1 Uzbekistan TV</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#08090d;color:#f4f4f6;font:15px system-ui,Arial,sans-serif}header{background:#111218;border-bottom:2px solid #e10600;padding:18px max(18px,calc((100% - 1180px)/2))}header a{color:#fff;text-decoration:none;font-weight:800}main{max-width:1180px;margin:auto;padding:28px 18px}h1{font-size:clamp(27px,5vw,42px);margin:0 0 8px}h1 span{color:#ff2929}.sub{color:#a8abb6;margin-bottom:26px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 24px}.filters button{background:#1c1e27;color:#fff;border:1px solid #363946;border-radius:999px;padding:10px 17px;cursor:pointer}.filters button.active{background:#e10600;border-color:#e10600}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}.card{background:#14161d;border:1px solid #292b36;border-radius:13px;overflow:hidden}.thumb{position:relative;display:block;aspect-ratio:16/9;background:#222;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#e10600;border-radius:12px;padding:11px 17px;font-size:23px;color:#fff}.info{padding:15px}.info h2{font-size:16px;line-height:1.45;margin:0 0 10px}.meta{font-size:12px;color:#aaa}.watch{display:inline-block;color:#fff;background:#a80c0c;text-decoration:none;border-radius:7px;padding:8px 12px;margin-top:12px}.status{color:#a8abb6;padding:25px 0}.viewer{position:fixed;inset:0;background:#000e;display:none;place-items:center;padding:18px;z-index:5}.viewer.open{display:grid}.modal{width:min(900px,100%)}.close{background:#e10600;border:0;color:white;padding:9px 15px;border-radius:6px;cursor:pointer;float:right;margin-bottom:10px}.frame{clear:both;aspect-ratio:16/9;background:#000}.frame iframe{width:100%;height:100%;border:0}.hint{font-size:12px;color:#9da0ab;margin-top:20px}
</style></head><body><header><a href="./index.html">🏎️ F1 UZBEKISTAN TV</a></header><main><h1>VIDEO <span>HIGHLIGHTS</span></h1><p class="sub">Saralash, poyga, avariya va eng qiziqarli lahzalar. Videolar YouTube mualliflari tomonidan e’lon qilingach chiqadi.</p><nav class="filters" aria-label="Video turlari"><button class="active" data-filter="all">Barchasi</button><button data-filter="crash">💥 Crash / Hodisalar</button><button data-filter="qualifying">⏱ Saralash</button><button data-filter="race">🏁 Poyga</button></nav><p id="status" class="status">Videolar yuklanmoqda…</p><section id="grid" class="grid"></section><p class="hint">Videolar asl YouTube kanallariga tegishli. Ba’zi videolar mintaqa yoki muallif cheklovi tufayli ochilmasligi mumkin.</p></main><div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="Video pleer"><div class="modal"><button id="close" class="close">✕ Yopish</button><div id="frame" class="frame"></div></div></div><script>
const grid=document.querySelector('#grid'),status=document.querySelector('#status');let videos=[],filter='all';
const match=(v)=>{const s=v.title.toLowerCase();if(filter==='crash')return /crash|collision|fire|flame|incident|spin|accident|alonso/.test(s);if(filter==='qualifying')return /qualifying|pole|q1|q2|q3/.test(s);if(filter==='race')return /race|highlight|overtak|battle|grand prix/.test(s);return true};
function render(){grid.replaceChildren();const list=videos.filter(match);status.textContent=list.length?'':(videos.length?'Bu turdagi video hozircha yo‘q.':'Hozircha videolar yo‘q. GitHub Actions va API kalitini tekshiring.');for(const v of list){const card=document.createElement('article');card.className='card';const thumb=document.createElement('a');thumb.href=v.url;thumb.className='thumb';thumb.target='_blank';thumb.rel='noopener noreferrer';const img=document.createElement('img');img.loading='lazy';img.alt='';img.src=v.thumbnail;const play=document.createElement('span');play.className='play';play.textContent='▶';thumb.append(img,play);thumb.addEventListener('click',e=>{e.preventDefault();openVideo(v.id)});const info=document.createElement('div');info.className='info';const h=document.createElement('h2');h.textContent=v.title;const meta=document.createElement('div');meta.className='meta';const date=new Date(v.published);meta.textContent=v.channel+' · '+(isNaN(date)?'':date.toLocaleString('uz-UZ'));const link=document.createElement('a');link.href=v.url;link.target='_blank';link.rel='noopener noreferrer';link.className='watch';link.textContent='YouTube’da ko‘rish ↗';info.append(h,meta,link);card.append(thumb,info);grid.append(card)}}
function openVideo(id){if(!/^[\w-]{11}$/.test(id))return;const frame=document.createElement('iframe');frame.src='https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1';frame.title='YouTube video';frame.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';frame.allowFullscreen=true;document.querySelector('#frame').replaceChildren(frame);document.querySelector('#viewer').classList.add('open')}
function closeVideo(){document.querySelector('#viewer').classList.remove('open');document.querySelector('#frame').replaceChildren()}
document.querySelector('#close').onclick=closeVideo;document.querySelector('#viewer').addEventListener('click',e=>{if(e.target.id==='viewer')closeVideo()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeVideo()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});
async function load(){try{const r=await fetch('./videos.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();videos=Array.isArray(d.videos)?d.videos:[];render()}catch(e){status.textContent='Videolarni yuklab bo‘lmadi: '+e.message}}load();setInterval(load,300000);
</script></body></html>
