<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">

<title>F1 Uzbekistan TV — Jonli efir</title>
<meta name="description" content="F1 Uzbekistan TV — jonli efir sahifasi.">

<style>
* {
  box-sizing: border-box;
}

:root {
  --red: #e10600;
  --bg: #090909;
  --panel: #141414;
  --border: #292929;
  --muted: #999;
}

body {
  margin: 0;
  background:
    radial-gradient(ellipse at 50% 0%, #35100e 0%, transparent 42%),
    var(--bg);
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
  min-height: 100vh;
}

header {
  min-height: 76px;
  padding: 0 5%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  background: rgba(12,12,12,.94);
  border-bottom: 1px solid var(--border);
}

.brand {
  display: flex;
  align-items: center;
  gap: 13px;
}

.logo {
  background: var(--red);
  padding: 9px 12px;
  border-radius: 6px;
  font-size: 25px;
  font-weight: 900;
  font-style: italic;
}

.brand-name {
  font-size: 17px;
  font-weight: 900;
  letter-spacing: 1px;
}

.brand-sub {
  color: #888;
  font-size: 10px;
  letter-spacing: 3px;
  margin-top: 5px;
}

.live {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 12px;
  border: 1px solid #54201e;
  border-radius: 6px;
  background: #24100f;
  color: #ff514c;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1px;
}

.live-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ff2525;
  box-shadow: 0 0 10px #e10600;
}

main {
  width: min(1060px, 100%);
  margin: 0 auto;
  padding: 45px 22px 35px;
}

.intro {
  text-align: center;
  margin-bottom: 27px;
}

.eyebrow {
  display: inline-block;
  color: #ff514c;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 3px;
  margin-bottom: 15px;
}

h1 {
  font-size: clamp(28px, 5vw, 43px);
  line-height: 1.15;
  letter-spacing: -1px;
  margin: 0;
  font-weight: 900;
}

h1 span {
  color: var(--red);
}

.intro p {
  color: #aaa;
  font-size: 14px;
  line-height: 1.6;
  margin: 13px 0 0;
}

.player-wrap {
  padding: 5px;
  border: 1px solid #373737;
  border-radius: 14px;
  background: linear-gradient(135deg, #41110f, #151515 45%);
  box-shadow: 0 20px 65px #0009;
}

.player {
  position: relative;
  overflow: hidden;
  background: #000;
  border-radius: 9px;
  aspect-ratio: 16 / 9;
}

.player iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
}

/* CHAT */
.chat {
  margin-top: 32px;
  padding: 22px;
  border: 1px solid #303030;
  border-radius: 12px;
  background: linear-gradient(110deg, #171717, #101010);
}

.chat h2 {
  margin: 0 0 6px;
  font-size: 20px;
}

.chat-subtitle {
  margin: 0 0 16px;
  color: #888;
  font-size: 12px;
}

.chat-messages {
  height: 320px;
  overflow-y: auto;
  padding: 12px;
  border: 1px solid #292929;
  border-radius: 9px;
  background: #0b0b0b;
}

.chat-empty {
  height: 100%;
  display: grid;
  place-items: center;
  color: #666;
  font-size: 13px;
  text-align: center;
}

.chat-message {
  padding: 9px 0;
  border-bottom: 1px solid #1d1d1d;
}

.chat-message:last-child {
  border-bottom: 0;
}

.chat-name {
  color: #ff514c;
  font-size: 12px;
  font-weight: 800;
}

.chat-time {
  margin-left: 7px;
  color: #555;
  font-size: 10px;
}

.chat-text {
  margin-top: 4px;
  color: #eee;
  font-size: 13px;
  line-height: 1.5;
  word-break: break-word;
}

.chat-form {
  display: grid;
  grid-template-columns: 150px 1fr auto;
  gap: 8px;
  margin-top: 12px;
}

.chat-form input {
  width: 100%;
  min-height: 44px;
  padding: 10px 12px;
  border: 1px solid #303030;
  border-radius: 7px;
  outline: none;
  background: #0d0d0d;
  color: #fff;
  font: inherit;
}

.chat-form input:focus {
  border-color: #e10600;
}

.chat-form button {
  min-height: 44px;
  padding: 0 18px;
  border: 0;
  border-radius: 7px;
  background: var(--red);
  color: #fff;
  cursor: pointer;
  font-size: 13px;
  font-weight: 800;
}

.chat-form button:hover {
  background: #b90500;
}

.chat-form button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

.chat-status {
  min-height: 18px;
  margin-top: 8px;
  color: #777;
  font-size: 11px;
}

.chat-status.error {
  color: #ff514c;
}

/* TELEGRAM */
.telegram {
  margin-top: 32px;
  padding: 25px 20px;
  border: 1px solid #303030;
  border-radius: 12px;
  background: linear-gradient(110deg, #171717, #101010);
  text-align: center;
}

.telegram h2 {
  font-size: 20px;
  margin: 0 0 9px;
}

.telegram p {
  color: #aaa;
  font-size: 13px;
  line-height: 1.6;
  margin: 0 auto 20px;
}

.telegram-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: min(100%, 340px);
  min-height: 50px;
  padding: 13px 18px;
  border-radius: 8px;
  background: #229ed9;
  color: #fff;
  text-decoration: none;
  font-size: 14px;
  font-weight: 800;
  transition: background .2s, transform .2s;
}

.telegram
