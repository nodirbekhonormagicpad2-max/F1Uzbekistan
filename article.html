<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">
<title>F1 yangiliklari — F1 Uzbekistan</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#fff;font-family:Arial,Helvetica,sans-serif}header{padding:20px 5%;background:#141414;border-bottom:2px solid #e10600}header a{color:white;text-decoration:none;font-weight:900}.wrap{max-width:850px;margin:0 auto;padding:28px 18px 60px}.back{display:inline-block;color:#ff7772;text-decoration:none;margin-bottom:24px}.source{color:#ff7772;font-size:13px;font-weight:800}h1{font-size:clamp(27px,5vw,46px);line-height:1.2;margin:15px 0}time{color:#aaa;font-size:13px}.hero{display:block;width:100%;max-height:460px;object-fit:cover;border-radius:14px;margin:24px 0}.notice{padding:20px;background:#171717;border:1px solid #333;border-radius:12px;color:#ddd;line-height:1.7}.origin{display:inline-block;margin-top:18px;color:#ff7772;font-weight:bold}.error{color:#ff7772}
</style>
</head>
<body>
<header><a href="./index.html">🏎️ F1 UZBEKISTAN TV</a></header>
<main class="wrap">
<a class="back" href="./index.html">← Bosh sahifaga qaytish</a>
<article id="article"><p>Yangilik yuklanmoqda...</p></article>
</main>
<script>
(async()=>{
 const root=document.getElementById('article');
 const id=new URLSearchParams(location.search).get('id');
 try{
  const response=await fetch('./news.json?t='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw Error('Yangiliklar yuklanmadi');
  const items=await response.json();
  if(!Array.isArray(items))throw Error('Ma’lumot xatosi');
  const item=items.find(x=>x&&x.url===id&&x.lang==='uz');
  if(!item)throw Error('Yangilik topilmadi yoki yangilangan');
  root.replaceChildren();
  const source=document.createElement('div');source.className='source';source.textContent=item.source||'Formula 1';
  const title=document.createElement('h1');title.textContent=item.title;
  const date=document.createElement('time');
  if(item.date){const d=new Date(item.date);if(!Number.isNaN(d.getTime()))date.textContent=d.toLocaleDateString('uz-UZ',{day:'numeric',month:'long',year:'numeric'});}
  root.append(source,title,date);
  if(typeof item.image==='string'&&item.image.startsWith('https://')){
   const image=document.createElement('img');image.className='hero';image.alt=item.title;image.referrerPolicy='no-referrer';image.src=item.image;image.onerror=()=>image.remove();root.appendChild(image);
  }
  const notice=document.createElement('p');notice.className='notice';notice.textContent='Bu yangilikning o‘zbekcha sarlavhasi avtomatik tayyorlangan. To‘liq maqola matni hozircha saytimizda mavjud emas. Batafsil ma’lumot uchun asl manbani ochishingiz mumkin.';root.appendChild(notice);
  if(typeof item.url==='string'&&item.url.startsWith('https://')){
   const link=document.createElement('a');link.className='origin';link.href=item.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Asl manbada o‘qish ↗';root.appendChild(link);
  }
 }catch(error){root.replaceChildren();const p=document.createElement('p');p.className='error';p.textContent=error.message;root.appendChild(p);}
})();
</script>
</body>
</html>
