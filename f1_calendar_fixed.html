<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F1 Uzbekistan — Grand Prix 2026–2027</title>
<style>
:root{--red:#e10600;--bg:#050505;--card:#101010;--line:#262626;--muted:#8b8b8b}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:#fff;font-family:Arial,Helvetica,sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 0,#e1060030,transparent 35%)}
.top{position:sticky;top:0;z-index:20;background:#050505e8;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.nav{max-width:1200px;margin:auto;padding:15px 18px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:950;letter-spacing:1px;font-size:18px}.logo b{font-size:29px;color:var(--red);font-style:italic;margin-right:8px}.logo small{display:block;color:#666;font-size:8px;letter-spacing:3px;margin-left:40px}
.back{color:#fff;text-decoration:none;border:1px solid #333;border-radius:9px;padding:10px 13px;font-size:12px;font-weight:700}
.wrap{max-width:1200px;margin:auto;padding:22px 18px 60px}
.hero{height:390px;border:1px solid #292929;border-radius:26px;overflow:hidden;position:relative;background:linear-gradient(125deg,#191919,#070707 65%);display:flex;align-items:flex-end}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 35%,#e1060018 75%,#e1060030)}
.track{position:absolute;right:4%;top:45px;width:48%;height:230px;border:5px solid #fff1;border-radius:58% 35% 55% 38%;transform:rotate(-9deg);box-shadow:0 0 0 22px #fff1,0 0 0 45px #fff1}
.track:after{content:"";position:absolute;inset:45px 75px;border:3px solid var(--red);border-radius:45% 60% 35% 55%;opacity:.75}
.heroText{position:relative;z-index:2;padding:30px;max-width:680px}.eyebrow{color:#ff3933;font-weight:900;font-size:11px;letter-spacing:3px}
h1{font-size:clamp(44px,8vw,88px);line-height:.82;font-style:italic;letter-spacing:-4px;margin:13px 0}.heroText p{color:#999;line-height:1.6;max-width:570px}
.switch{display:flex;gap:8px;margin:24px 0 15px}.year{cursor:pointer;background:#111;color:#777;border:1px solid #333;border-radius:11px;padding:12px 25px;font-weight:900}.year.active{background:var(--red);border-color:var(--red);color:#fff}
.seasonHead{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 12px}.seasonHead h2{margin:0;font-size:25px}.seasonHead span{color:#666;font-size:11px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{position:relative;overflow:hidden;background:linear-gradient(145deg,#151515,#0c0c0c);border:1px solid #272727;border-radius:17px;min-height:205px;padding:17px;transition:.25s}
.card:hover{transform:translateY(-4px);border-color:#555;box-shadow:0 12px 35px #000}
.card:first-child{border-color:var(--red)}
.num{color:#555;font-size:10px;font-weight:900;letter-spacing:1px}.flag{position:absolute;right:15px;top:12px;font-size:25px}
.card h3{margin:25px 0 4px;font-size:20px}.place{font-size:11px;color:#888}.date{margin-top:18px;font-size:12px;font-weight:800}
.bottom{display:flex;align-items:center;justify-content:space-between;margin-top:15px}.gp{font-size:9px;color:#666;border:1px solid #333;padding:5px 7px;border-radius:6px}.sprint{font-size:9px;background:var(--red);padding:5px 7px;border-radius:6px;font-weight:900}
.next{margin:0 0 20px;border:1px solid #3b1111;background:linear-gradient(100deg,#1b0707,#0b0b0b);border-radius:18px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}.next small{color:#777}.next b{font-size:24px;display:block;margin:3px 0}.next strong{color:var(--red);font-size:28px}
.footer{text-align:center;color:#555;font-size:10px;margin-top:35px}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.track{opacity:.45;width:65%}}
@media(max-width:560px){.wrap{padding:14px 11px 45px}.hero{height:390px}.heroText{padding:22px}.track{width:90%;right:-20%;top:55px;opacity:.35}.grid{grid-template-columns:1fr}.next{align-items:flex-start;gap:15px}.next strong{font-size:20px}.seasonHead h2{font-size:21px}}
</style>
</head>
<body>
<header class="top"><div class="nav">
<div class="logo"><b>F1</b>UZBEKISTAN TV<small>GRAND PRIX CALENDAR</small></div>
<a class="back" href="index.html">← JONLI EFIR</a>
</div></header>

<main class="wrap">
<section class="hero">
<div class="track"></div>
<div class="heroText">
<div class="eyebrow">FORMULA 1 • 2026 / 2027</div>
<h1>GRAND<br>PRIX.</h1>
<p>Formula 1’ning 2026 va 2027 mavsumlari. Barcha 24 ta poyga, sanalar, trassalar va Sprint hafta oxirlari.</p>
</div>
</section>

<div class="switch">
<button class="year active" data-year="2026">2026 SEASON</button>
<button class="year" data-year="2027">2027 SEASON</button>
</div>

<div id="next"></div>
<div class="seasonHead"><h2 id="title">2026 RACE CALENDAR</h2><span>24 ROUNDS</span></div>
<section id="grid" class="grid"></section>
<div class="footer">F1 Uzbekistan TV • Formula 1 rasmiy kalendar ma’lumotlari asosida.</div>
</main>

<script>
const races={
2026:[
["🇦🇺","Australia","Melbourne","6–8 Mar",""],["🇨🇳","China","Shanghai","13–15 Mar","SPRINT"],["🇯🇵","Japan","Suzuka","27–29 Mar",""],["🇧🇭","Bahrain","Sakhir","10–12 Apr",""],["🇸🇦","Saudi Arabia","Jeddah","17–19 Apr",""],["🇺🇸","Miami","Miami","1–3 May","SPRINT"],["🇨🇦","Canada","Montreal","22–24 May","SPRINT"],["🇲🇨","Monaco","Monaco","5–7 Jun",""],["🇪🇸","Spain","Barcelona","12–14 Jun",""],["🇦🇹","Austria","Spielberg","26–28 Jun",""],["🇬🇧","Great Britain","Silverstone","3–5 Jul","SPRINT"],["🇧🇪","Belgium","Spa-Francorchamps","17–19 Jul",""],["🇭🇺","Hungary","Budapest","24–26 Jul",""],["🇳🇱","Netherlands","Zandvoort","21–23 Aug","SPRINT"],["🇮🇹","Italy","Monza","4–6 Sep",""],["🇪🇸","Spain","Madrid","11–13 Sep",""],["🇦🇿","Azerbaijan","Baku","24–26 Sep",""],["🇸🇬","Singapore","Singapore","9–11 Oct","SPRINT"],["🇺🇸","United States","Austin","23–25 Oct",""],["🇲🇽","Mexico","Mexico City","30 Oct–1 Nov",""],["🇧🇷","Brazil","São Paulo","6–8 Nov",""],["🇺🇸","Las Vegas","Las Vegas","19–21 Nov",""],["🇶🇦","Qatar","Lusail","27–29 Nov",""],["🇦🇪","Abu Dhabi","Yas Marina","4–6 Dec",""]
],
2027:[
["🇧🇭","Bahrain","Sakhir","12–14 Mar",""],["🇸🇦","Saudi Arabia","Jeddah","19–21 Mar",""],["🇦🇺","Australia","Melbourne","2–4 Apr","SPRINT"],["🇯🇵","Japan","Suzuka","9–11 Apr","SPRINT"],["🇨🇳","China","Shanghai","16–18 Apr",""],["🇺🇸","Miami","Miami","30 Apr–2 May",""],["🇨🇦","Canada","Montreal","21–23 May","SPRINT"],["🇲🇨","Monaco","Monaco","4–6 Jun","SPRINT"],["🇵🇹","Portugal","Portimão","18–20 Jun",""],["🇬🇧","Great Britain","Silverstone","2–4 Jul",""],["🇦🇹","Austria","Spielberg","9–11 Jul",""],["🇧🇪","Belgium","Spa-Francorchamps","23–25 Jul","SPRINT"],["🇭🇺","Hungary","Budapest","30 Jul–1 Aug",""],["🇮🇹","Italy","Monza","3–5 Sep","SPRINT"],["🇪🇸","Spain","Madrid","10–12 Sep",""],["🇦🇿","Azerbaijan","Baku","24–26 Sep",""],["🇹🇷","Türkiye","Istanbul","1–3 Oct",""],["🇸🇬","Singapore","Singapore","8–10 Oct",""],["🇺🇸","United States","Austin","22–24 Oct",""],["🇲🇽","Mexico","Mexico City","29–31 Oct",""],["🇧🇷","Brazil","São Paulo","5–7 Nov","SPRINT"],["🇺🇸","Las Vegas","Las Vegas","18–20 Nov",""],["🇶🇦","Qatar","Lusail","3–5 Dec","SPRINT"],["🇦🇪","Abu Dhabi","Yas Marina","10–12 Dec","SPRINT"]
]};
let year=2026;
const grid=document.getElementById("grid"),title=document.getElementById("title"),next=document.getElementById("next");
function render(){
const a=races[year];grid.innerHTML="";title.textContent=year+" RACE CALENDAR";
a.forEach((r,i)=>{
const c=document.createElement("article");c.className="card";
c.innerHTML=`<div class="num">ROUND ${String(i+1).padStart(2,"0")}</div><div class="flag">${r[0]}</div><h3>${r[1]} GRAND PRIX</h3><div class="place">🏁 ${r[2]}</div><div class="date">📅 ${r[3]} ${year}</div><div class="bottom"><span class="gp">GRAND PRIX</span>${r[4]?'<span class="sprint">SPRINT</span>':''}</div>`;
grid.appendChild(c)});
const r=a[0];next.innerHTML=`<div class="next"><div><small>SEASON OPENER</small><b>${r[0]} ${r[1]} GRAND PRIX</b><small>${r[3]} ${year} • ${r[2]}</small></div><strong>24 ROUNDS</strong></div>`;
}
document.querySelectorAll(".year").forEach(b=>b.onclick=()=>{year=+b.dataset.year;document.querySelectorAll(".year").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()});
render();
</script>
</body>
</html>
